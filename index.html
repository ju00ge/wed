  if (OFFICIAL[n]) return "Номер " + n + " уже официальный — его нельзя занять";
  for (const [c, cid] of Object.entries(codeMap())) {
    if (cid === id) continue;
    if (c === n) return "Номер " + n + " уже занят";
    if (c.startsWith(n) || n.startsWith(c)) return "Конфликт с номером " + c + " (один начинается с другого)";
  }
  return "";
}

// ---------- копирование ----------
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  try {
    const keep = document.activeElement;
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy"); ta.remove();
    if (keep && keep.focus) keep.focus({ preventScroll: true });
    return ok;
  } catch (_) { return false; }
}
let tTimer;
function toast(msg, bad) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(tTimer); tTimer = setTimeout(() => t.className = "", 1800);
}

// ---------- карточка ----------
const langOf = {}; // id -> "ru"|"en"
const textOf = e => (langOf[e.id] === "en" && e.en) ? e.en : e.ru;
function hl(s) {
  let out = "", last = 0, m; BLANK_RE.lastIndex = 0;
  while ((m = BLANK_RE.exec(s))) { out += esc(s.slice(last, m.index)) + '<mark class="blank">' + esc(m[0]) + "</mark>"; last = m.index + m[0].length; }
  return out + esc(s.slice(last));
}
function cardHTML(e) {
  const txt = textOf(e), warn = hasBlank(txt), draft = e.status === "Черновик";
  const c = codeOf(e), fav = S.fav.includes(e.id);
  const title = e.title
    ? '<div class="title">' + esc(e.title) + "</div>"
    : '<div class="title none">' + esc(e.ru.slice(0, 45)) + (e.ru.length > 45 ? "…" : "") + "<i>нет названия</i></div>";
  return '<article class="card' + (warn ? " warn" : "") + (draft ? " draft" : "") + '" data-id="' + esc(e.id) + '">' +
    '<div class="meta"><span class="badge">' + esc(e.section) + "</span>" +
    (draft ? '<span class="badge red">Черновик</span>' : "") +
    (warn ? '<span class="badge red">!!! заполнить перед отправкой</span>' : "") +
    (c ? '<span class="num">№ ' + esc(c) + (e.code ? "" : " · личный") + "</span>" : "") + "</div>" +
    title + '<div class="text">' + hl(txt) + "</div>" +
    '<div class="actions"><button class="btn primary" data-act="copy">Копировать</button>' +
    (e.en ? '<span class="lang"><button data-act="ru" class="' + (langOf[e.id] !== "en" ? "on" : "") + '">RU</button><button data-act="en" class="' + (langOf[e.id] === "en" ? "on" : "") + '">EN</button></span>' : "") +
    '<button class="btn icon' + (fav ? " fav-on" : "") + '" data-act="fav" aria-label="Избранное">' + (fav ? "★" : "☆") + "</button>" +
    (e.code ? "" : '<button class="btn icon" data-act="num" aria-label="Личный номер">#</button>') +
    "</div></article>";
}

// ---------- экраны ----------
const out = document.getElementById("out"), q = document.getElementById("q");
function render() {
  const v = q.value.trim();
  if (!v) return renderHome();
  if (/^\d+$/.test(v)) return renderCode(v);
  const res = search(v);
  out.innerHTML = res.length ? res.map(cardHTML).join("") : '<div class="empty">Точного шаблона по этому запросу в базе нет</div>';
}
function renderHome() {
  const cm = codeMap();
  const codes = Object.keys(cm).sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
  let h = "";
  if (codes.length) h += '<h2 class="h">Коды</h2><ul class="codes">' + codes.map(c => {
    const e = BY_ID[cm[c]];
    return '<li><button data-code="' + esc(c) + '"><span class="n">' + esc(c) + '</span><span class="t">' +
      esc(e.title || e.ru.slice(0, 60)) + "</span>" + (e.code ? "" : '<span class="p">личный</span>') + "</button></li>";
  }).join("") + "</ul>";
  const favs = S.fav.map(id => BY_ID[id]).filter(Boolean);
  h += '<h2 class="h">Избранное</h2>' + (favs.length ? favs.map(cardHTML).join("") : '<div class="empty">Пока пусто — нажмите ☆ на карточке</div>');
  out.innerHTML = h;
}
let lastAuto = "";
function renderCode(v) {
  const cm = codeMap(), id = cm[v];
  if (id) {
    out.innerHTML = cardHTML(BY_ID[id]);
    if (lastAuto !== v) {
      lastAuto = v;
      copyText(textOf(BY_ID[id])).then(ok => ok ? toast("Скопировано: № " + v) : toast("Нажмите «Копировать»", true));
    }
    return;
  }
  const pref = Object.keys(cm).filter(c => c.startsWith(v));
  out.innerHTML = pref.length
    ? pref.map(c => cardHTML(BY_ID[cm[c]])).join("")
    : '<div class="empty">Шаблона с номером ' + esc(v) + " нет</div>";
}
function renderFoot() {
  document.getElementById("foot").innerHTML =
    '<div class="row"><button class="btn" id="exp">Скачать настройки</button><button class="btn" id="imp">Загрузить настройки</button></div>' +
    "<div>Записей в базе: " + DATA.length + " · версия " + esc(VERSION) + "</div>";
  document.getElementById("exp").onclick = exportSettings;
  document.getElementById("imp").onclick = () => document.getElementById("file").click();
}

// ---------- события ----------
q.addEventListener("input", () => { if (!/^\d+$/.test(q.value.trim())) lastAuto = ""; render(); });
document.getElementById("clear").onclick = () => { q.value = ""; lastAuto = ""; render(); q.focus(); };
out.addEventListener("click", async ev => {
  const cb = ev.target.closest("[data-code]");
  if (cb) { q.value = cb.dataset.code; lastAuto = ""; render(); return; }
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const card = b.closest(".card"), e = BY_ID[card.dataset.id], act = b.dataset.act;
  if (act === "copy") { const ok = await copyText(textOf(e)); toast(ok ? "Скопировано" : "Не удалось скопировать", !ok); }
  else if (act === "ru" || act === "en") { langOf[e.id] = act; card.outerHTML = cardHTML(e); }
  else if (act === "fav") {
    S.fav = S.fav.includes(e.id) ? S.fav.filter(x => x !== e.id) : S.fav.concat(e.id); save();
    if (!q.value.trim()) render(); else card.outerHTML = cardHTML(e);
  }
  else if (act === "num") openNum(card, e);
  else if (act === "numsave") {
    const inp = card.querySelector(".numedit input"), n = inp.value.trim(), err = checkNum(n, e.id);
    if (err) { card.querySelector(".numedit .err").textContent = err; return; }
    S.nums[e.id] = n; save(); toast("Личный номер " + n + " сохранён"); card.outerHTML = cardHTML(e);
  }
  else if (act === "numdel") { delete S.nums[e.id]; save(); card.outerHTML = cardHTML(e); if (!q.value.trim()) render(); }
});
function openNum(card, e) {
  if (card.querySelector(".numedit")) return;
  const d = document.createElement("div"); d.className = "numedit";
  d.innerHTML = '<input inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Личный номер" value="' + esc(S.nums[e.id] || "") + '">' +
    '<button class="btn" data-act="numsave">Сохранить</button>' + (S.nums[e.id] ? '<button class="btn" data-act="numdel">Удалить</button>' : "") + '<div class="err"></div>';
  card.appendChild(d); d.querySelector("input").focus();
}
function exportSettings() {
  const blob = new Blob([JSON.stringify({ app: "bufer", version: 1, saved: new Date().toISOString(), fav: S.fav, nums: S.nums }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "bufer-nastroyki.json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
document.getElementById("file").addEventListener("change", async ev => {
  const f = ev.target.files[0]; ev.target.value = ""; if (!f) return;
  try {
    const r = sanitize(JSON.parse(await f.text()));
    for (const [id, n] of Object.entries(r.nums)) if (checkNumAgainst(n, id, r.nums)) delete r.nums[id];
    S = r; save(); render(); toast("Настройки загружены");
  } catch (_) { toast("Файл не подходит", true); }
});
function checkNumAgainst(n, id, nums) {
  if (OFFICIAL[n] || BY_ID[id].code) return true;
  for (const c of Object.keys(OFFICIAL)) if (c.startsWith(n) || n.startsWith(c)) return true;
  for (const [oid, c] of Object.entries(nums)) if (oid !== id && (c.startsWith(n) || n.startsWith(c))) return true;
  return false;
}

render(); renderFoot();

// ---------- PWA: офлайн и автообновление ----------
if ("serviceWorker" in navigator) {
  let hadCtrl = !!navigator.serviceWorker.controller, pending = false;
  const reload = () => { if (!q.value.trim() && document.activeElement !== q) location.reload(); else pending = true; };
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadCtrl) reload(); hadCtrl = true; });
  navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(reg => {
    const check = () => reg.update().catch(() => {});
    setInterval(check, 30 * 60 * 1000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") { if (pending) location.reload(); else check(); }
    });
  }).catch(() => {});
}
</script>
</body>
